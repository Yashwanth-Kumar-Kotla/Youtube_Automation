# ---------------------------------------------------------------------------
# AutoShorts config. One block per channel. Secrets NEVER go here (GitHub Secrets only).
# A channel's creative rules live in memory/channels/<name>/BIBLE.md. This file is the machine settings.
# ---------------------------------------------------------------------------
timezone: America/Chicago
# Production: two scheduled runs a day (3:37 and 8:37 AM CT) fill the stock.
production:
  max_videos_per_run: 4      # protects your own Claude usage; raise it to make more per run

# Stock: videos are made ahead, scored, and posted best-first (docs/AUTOPILOT.md, "Stock").
stock:
  cap: 30                    # max ready videos per channel; past this, spare capacity goes to new channels / hook tests
  max_per_cluster: 2         # max ready videos per topic cluster (keeps variety, protects the backlog)
  threshold: 0.4             # below this a video is never posted; it goes to rework
  start_confidence: 0.7
  max_age_days: 42           # older stock is retired automatically
  order: fifo                # fifo = post in the order made (needed for next-episode teases); best = highest confidence first

llm:                         # only used by the sketch fallback renderer (run.py)
  model: claude-opus-5-5
  effort: medium

render:
  fps: 30
  format: shorts

channels:
  body:
    enabled: true
    series: "Body Files"
    style: inside-out          # faceless-shorts style; studio/body holds its growing kit
    kokoro_voice: am_michael
    kokoro_speed: 1.15
    ending: tease_next         # tease_next = each video names the next one (chain); series_cta = generic follow line
    chain_start: "What happens if you swallow a magnet?"   # promised by the live Body Files #1
    slots:                     # posts per day = number of slots (max 3; stay at 1-2 until the API audit passes)
      - {youtube: 17, tiktok: 19}   # local hours: YouTube goes public / TikTok is sent
    youtube:
      enabled: true
      made_for_kids: false     # general audience by design (see BIBLE)
      category_id: "27"        # Education
      publish_hour_local: 17
    tiktok:
      enabled: true
      mode: draft              # draft until the TikTok app passes review, then: direct
      post_hour_local: 19     # TikTok post hour (the analyst tunes this from data)
    scout_queries: ["what happens if body", "what happens to your body", "human body facts shorts"]
    reddit_subs: [todayilearned, askscience, NoStupidQuestions, AskDocs]
    # sketch fallback (run.py) settings
    niche: "What-happens-if body and science explainers for a general audience"
    audience: "13-35, curious, US/UK/CA/AU"
    tone: "curious friend, matter-of-fact, a little dark humor, never gory"
    voice: en-US-BrianNeural
    rate: "+12%"
    pitch: "+0Hz"
    scenes: [6, 8]
    target_seconds: [30, 45]
    accent: "#FF6B35"
    fact_check: true
    seed_topics: []

  mature:
    enabled: false           # turn on once the channel exists (its YouTube token is saved)
    series: "After 40"
    style: inside-out
    kokoro_voice: am_michael
    kokoro_speed: 1.08
    ending: tease_next         # tease_next = each video names the next one (chain); series_cta = generic follow line
    slots:                     # posts per day = number of slots (max 3; stay at 1-2 until the API audit passes)
      - {youtube: 7, tiktok: 12}   # local hours: YouTube goes public / TikTok is sent
    youtube:
      enabled: false           # flip to true once this channel exists and its token is saved
      made_for_kids: false
      category_id: "26"
      publish_hour_local: 7
    tiktok:
      enabled: false
      mode: draft
      post_hour_local: 12     # TikTok post hour (the analyst tunes this from data)
    scout_queries: ["what happens to your body after 40", "health after 50 shorts", "habits after 40"]
    reddit_subs: [AskDocs, Fitness30plus, nutrition, longevity]
    niche: "Health, aging and longevity for people over 40"
    audience: "adults 40-70, US/UK/CA/AU"
    tone: "calm, trustworthy doctor-friend, one practical takeaway"
    voice: en-US-AndrewNeural
    rate: "+6%"
    pitch: "+0Hz"
    scenes: [6, 9]
    target_seconds: [35, 50]
    accent: "#2E86AB"
    caption_scale: 1.15
    fact_check: true
    seed_topics: []

  survival:
    enabled: false           # turn on once the channel exists (its YouTube token is saved)
    series: "Would You Survive?"
    style: stick-story
    kokoro_voice: am_puck
    kokoro_speed: 1.15
    ending: tease_next         # tease_next = each video names the next one (chain); series_cta = generic follow line
    slots:                     # posts per day = number of slots (max 3; stay at 1-2 until the API audit passes)
      - {youtube: 18, tiktok: 20}   # local hours: YouTube goes public / TikTok is sent
    youtube:
      enabled: false
      made_for_kids: false
      category_id: "24"        # Entertainment
      publish_hour_local: 18
    tiktok:
      enabled: false
      mode: draft
      post_hour_local: 20     # TikTok post hour (the analyst tunes this from data)
    scout_queries: ["what to do if survival", "how to survive shorts", "would you survive"]
    reddit_subs: [Survival, preppers, LifeProTips, interestingasfuck]
    niche: "What to do if you face a deadly situation: survival steps and myths"
    audience: "13-30, US"
    tone: "urgent, second person, lively"
    voice: en-US-ChristopherNeural
    rate: "+15%"
    pitch: "+0Hz"
    scenes: [7, 9]
    target_seconds: [30, 45]
    accent: "#E63946"
    fact_check: true
    seed_topics: []
