name: tiktok-page-data
# Refreshes the public data the approval page reads: creator_info (nickname, avatar, privacy options) and the queue.
on:
  schedule: [{ cron: "17 */3 * * *" }]
  push:
    branches: [main]
    paths: [".github/tiktok-page-request", "state/stock/**"]
  workflow_dispatch:
permissions: { contents: write }
concurrency: tiktok-page-data
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q pyyaml requests
      - name: Production app
        continue-on-error: true
        env:
          TIKTOK_APP: prod
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_BODY_REFRESH_TOKEN: ${{ secrets.TIKTOK_BODY_REFRESH_TOKEN }}
        run: python -u -m pipeline.tiktok_page
      - name: Sandbox app
        continue-on-error: true
        env:
          TIKTOK_APP: sandbox
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_SANDBOX_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_SANDBOX_CLIENT_SECRET }}
          TIKTOK_BODY_REFRESH_TOKEN: ${{ secrets.TIKTOK_SANDBOX_REFRESH_TOKEN }}
        run: python -u -m pipeline.tiktok_page
      - name: Save
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add state/tiktok || true
          git diff --cached --quiet && exit 0
          git commit -m "tiktok: page data $(date -u +%FT%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
