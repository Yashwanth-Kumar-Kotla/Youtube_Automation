name: tiktok-status
# Read-only: asks TikTok for the status of every draft upload we recorded.
on:
  push:
    branches: [main]
    paths: [".github/tiktok-status-request"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q pyyaml requests
      - name: Status
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_BODY_REFRESH_TOKEN: ${{ secrets.TIKTOK_BODY_REFRESH_TOKEN }}
        run: |
          mkdir -p state/audit
          python -u -m pipeline.tiktok_status 2>&1 | tee state/audit/tiktok_status_log.txt
      - name: Save
        if: always()
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add state/audit || true
          git diff --cached --quiet && exit 0
          git commit -m "tiktok: draft status check $(date -u +%FT%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
