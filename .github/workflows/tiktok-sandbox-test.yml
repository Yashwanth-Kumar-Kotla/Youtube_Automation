name: tiktok-sandbox-test
# Sandbox Direct Post test. Uses the SANDBOX app's own secrets so the Production inbox drafts keep working.
# Request file .github/tiktok-sandbox-request: lines "mode: direct", "privacy: SELF_ONLY", "record: no", then video ids.
on:
  push:
    branches: [main]
    paths: [".github/tiktok-sandbox-request"]
  workflow_dispatch:
permissions: { contents: write }
concurrency: publish
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q pyyaml requests google-api-python-client google-auth
      - name: Sandbox direct post
        env:
          GH_TOKEN: ${{ github.token }}
          TIKTOK_REQUEST: tiktok-sandbox-request
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_SANDBOX_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_SANDBOX_CLIENT_SECRET }}
          TIKTOK_BODY_REFRESH_TOKEN: ${{ secrets.TIKTOK_SANDBOX_REFRESH_TOKEN }}
        run: |
          mkdir -p state/audit
          python -u -m pipeline.tiktok_bulk 2>&1 | tee state/audit/tiktok_sandbox_log.txt; exit ${PIPESTATUS[0]}
      - name: Save log
        if: always()
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add state/audit || true
          git diff --cached --quiet && exit 0
          git commit -m "tiktok: sandbox direct-post test $(date -u +%FT%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
