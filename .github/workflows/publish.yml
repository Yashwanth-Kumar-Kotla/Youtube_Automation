name: publish
on:
  schedule: [{ cron: "23 * * * *" }]     # hourly: fill today's slots from stock (YouTube ahead of time, TikTok in its hour)
  push:                                  # safety net while GitHub's scheduler warms up: also run when stock changes
    branches: [main]
    paths: ["state/stock/**", ".github/publish-request"]
  workflow_dispatch:
permissions: { contents: write }
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q pyyaml requests google-api-python-client google-auth
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_BODY_REFRESH_TOKEN: ${{ secrets.YT_BODY_REFRESH_TOKEN }}
          YT_MATURE_REFRESH_TOKEN: ${{ secrets.YT_MATURE_REFRESH_TOKEN }}
          YT_SURVIVAL_REFRESH_TOKEN: ${{ secrets.YT_SURVIVAL_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_BODY_REFRESH_TOKEN: ${{ secrets.TIKTOK_BODY_REFRESH_TOKEN }}
          TIKTOK_MATURE_REFRESH_TOKEN: ${{ secrets.TIKTOK_MATURE_REFRESH_TOKEN }}
          TIKTOK_SURVIVAL_REFRESH_TOKEN: ${{ secrets.TIKTOK_SURVIVAL_REFRESH_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m pipeline.publish
      - name: Save results
        if: always()
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add state/ memory/ POST_TODAY.md || true
          git diff --cached --quiet && exit 0
          git commit -m "publish: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
