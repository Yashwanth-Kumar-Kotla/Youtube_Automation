name: daily-shorts
on:
  schedule:
    # times are UTC. Videos are rendered here, then YouTube publishes at each channel's publish_hour_local.
    - cron: "17 9 * * *"     # ~3-4 AM Central: make all 3 channels
  workflow_dispatch:
    inputs:
      channel: { description: "kids | mature | viral | all", default: "all" }
      no_upload: { description: "render only", type: boolean, default: false }

permissions:
  contents: write

concurrency: daily-shorts

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
      - name: Make + post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_KIDS_REFRESH_TOKEN: ${{ secrets.YT_KIDS_REFRESH_TOKEN }}
          YT_MATURE_REFRESH_TOKEN: ${{ secrets.YT_MATURE_REFRESH_TOKEN }}
          YT_VIRAL_REFRESH_TOKEN: ${{ secrets.YT_VIRAL_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_MATURE_REFRESH_TOKEN: ${{ secrets.TIKTOK_MATURE_REFRESH_TOKEN }}
          TIKTOK_VIRAL_REFRESH_TOKEN: ${{ secrets.TIKTOK_VIRAL_REFRESH_TOKEN }}
        run: |
          python run.py --channel "${{ inputs.channel || 'all' }}" ${{ inputs.no_upload && '--no-upload' || '' }}
      - name: Keep the videos 14 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: videos, path: "out/**/*.mp4", retention-days: 14, if-no-files-found: ignore }
      - name: Save topic history
        if: always()
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add state/ && git commit -m "state: daily run $(date -u +%F)" && git push || echo "no state change"
