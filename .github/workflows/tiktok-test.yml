name: tiktok-test
on:
  push:
    branches: [main]
    paths: [".github/tiktok-test-request"]
permissions: { contents: write }
concurrency: publish
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q pyyaml requests google-api-python-client google-auth
      - name: Credential check + one test draft to the TikTok inbox
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_BODY_REFRESH_TOKEN: ${{ secrets.YT_BODY_REFRESH_TOKEN }}
          YT_MATURE_REFRESH_TOKEN: ${{ secrets.YT_MATURE_REFRESH_TOKEN }}
          YT_SURVIVAL_REFRESH_TOKEN: ${{ secrets.YT_SURVIVAL_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_BODY_REFRESH_TOKEN: ${{ secrets.TIKTOK_BODY_REFRESH_TOKEN }}
          TIKTOK_MATURE_REFRESH_TOKEN: ${{ secrets.TIKTOK_MATURE_REFRESH_TOKEN }}
          TIKTOK_SURVIVAL_REFRESH_TOKEN: ${{ secrets.TIKTOK_SURVIVAL_REFRESH_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          mkdir -p state/audit
          python -m pipeline.verify > /dev/null
          { echo "$ tiktok.upload(body, demo/body-files-1.mp4, mode=draft)   ($(date -u +%FT%TZ))"
            python -u -c "from pipeline import tiktok; print('publish_id', tiktok.upload('body', 'demo/body-files-1.mp4', 'TEST draft: Body Files #1', 'draft'))"
            echo "exit code $?"; } 2>&1 | tee state/audit/tiktok_test_log.txt
      - name: Save
        if: always()
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet && exit 0
          git commit -m "tiktok: credential check + test draft $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
