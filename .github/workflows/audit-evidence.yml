name: audit-evidence
on:
  push:
    branches: [main]
    paths: [".github/evidence-request"]
  workflow_dispatch:
permissions: { contents: write }
concurrency: publish          # same lock as the publisher: never a double upload
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q pyyaml requests google-api-python-client google-auth
      - name: Upload via the real publisher (videos.insert + commentThreads.insert)
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_BODY_REFRESH_TOKEN: ${{ secrets.YT_BODY_REFRESH_TOKEN }}
          YT_MATURE_REFRESH_TOKEN: ${{ secrets.YT_MATURE_REFRESH_TOKEN }}
          YT_SURVIVAL_REFRESH_TOKEN: ${{ secrets.YT_SURVIVAL_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_BODY_REFRESH_TOKEN: ${{ secrets.TIKTOK_BODY_REFRESH_TOKEN }}
          TIKTOK_MATURE_REFRESH_TOKEN: ${{ secrets.TIKTOK_MATURE_REFRESH_TOKEN }}
          TIKTOK_SURVIVAL_REFRESH_TOKEN: ${{ secrets.TIKTOK_SURVIVAL_REFRESH_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          mkdir -p state/audit
          { echo "$ python -m pipeline.publish --tag daily-2026-11-08   ($(date -u +%FT%TZ))"; python -u -m pipeline.publish --tag daily-2026-11-08; echo "exit code $?"; } 2>&1 | tee state/audit/b1_upload_log.txt
      - name: Analytics (reports.query)
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_BODY_REFRESH_TOKEN: ${{ secrets.YT_BODY_REFRESH_TOKEN }}
          YT_MATURE_REFRESH_TOKEN: ${{ secrets.YT_MATURE_REFRESH_TOKEN }}
          YT_SURVIVAL_REFRESH_TOKEN: ${{ secrets.YT_SURVIVAL_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_BODY_REFRESH_TOKEN: ${{ secrets.TIKTOK_BODY_REFRESH_TOKEN }}
          TIKTOK_MATURE_REFRESH_TOKEN: ${{ secrets.TIKTOK_MATURE_REFRESH_TOKEN }}
          TIKTOK_SURVIVAL_REFRESH_TOKEN: ${{ secrets.TIKTOK_SURVIVAL_REFRESH_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m pipeline.audit_analytics body
      - name: Save
        if: always()
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add state/ memory/ || true
          git diff --cached --quiet && exit 0
          git commit -m "audit evidence + publish $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
