name: tiktok-auto-drafts
# Owner request (2026-11-16): every newly stocked video goes to the TikTok inbox as a draft right away.
# Runs when the production run pushes stock changes; sends videos made on/after config tiktok.auto_draft_since that were
# never sent (state/tiktok_drafts.json). If TikTok refuses (too many pending drafts / rate limit), the next push retries.
on:
  push:
    branches: [main]
    paths: ["state/stock/body.json"]
  workflow_dispatch:
permissions: { contents: write }
concurrency: publish
jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q pyyaml requests google-api-python-client google-auth
      - name: Send new videos to the TikTok inbox
        env:
          GH_TOKEN: ${{ github.token }}
          TIKTOK_AUTO: "1"
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_BODY_REFRESH_TOKEN: ${{ secrets.TIKTOK_BODY_REFRESH_TOKEN }}
        run: |
          mkdir -p state/audit
          python -u -m pipeline.tiktok_bulk 2>&1 | tee state/audit/tiktok_auto_log.txt; exit 0
      - name: Save
        if: always()
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add state/ || true
          git diff --cached --quiet && exit 0
          git commit -m "tiktok: auto drafts $(date -u +%FT%H%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
